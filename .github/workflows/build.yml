name: Build unsigned IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Liquid Glass(iOS 26 SDK)のビルドには Xcode 26 が必要
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project IPAEditor.xcodeproj \
            -scheme IPAEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IPAEditor.app Payload/
          zip -r IPAEditor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPAEditor-unsigned
          path: IPAEditor.ipa
